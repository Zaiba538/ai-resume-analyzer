name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: "Also run live Groq smoke tests (requires the GROQ_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  LANGSMITH_TRACING: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint and tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Node.js runs the frontend behaviour tests (standard library only, no npm).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Node.js version
        run: node --version
      - name: Install hashed dev lock
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests (offline; live tests deselected)
        env:
          FRONTEND_REQUIRE_NODE: "1" # the frontend Node.js tests must run, never skip
        run: python -m pytest

  integrity:
    name: Lock and legacy integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv (hash-pinned)
        run: |
          echo "uv==0.13.6 --hash=sha256:22759b8895e1103578de6fb4cd27e94b4399d021023378d29f01333717751fba" > "$RUNNER_TEMP/uv.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/uv.txt"
      - name: Locks are in sync with requirements.in / requirements-dev.in
        run: |
          uv pip compile requirements.in --universal --python-version 3.12 \
            --generate-hashes -o requirements.txt
          uv pip compile requirements-dev.in --universal --python-version 3.12 \
            --generate-hashes -c requirements.txt -o requirements-dev.txt
          git diff --exit-code -- requirements.txt requirements-dev.txt
      - name: Legacy application is unmodified
        run: git diff --exit-code 395fe6a -- app.py agents utils

  live-smoke:
    name: Live Groq smoke tests (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install hashed dev lock
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Live tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m pytest -m live tests/live
